<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Google Docs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #333;
        }

        .docs-container {
            max-width: 500px;
            margin: auto;
        }

        .doc-link {
            display: block;
            background: white;
            color: #1a73e8;
            text-decoration: none;
            padding: 15px;
            margin: 12px 0;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            transition: 0.2s;
            font-size: 18px;
        }

        .doc-link:hover {
            background: #1a73e8;
            color: white;
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <h1>📄 My Google Documents</h1>

    <div class="docs-container">
        <a class="doc-link" href="https://docs.google.com/document/d/Lj9vh3N3npC0Fgy0gj7pXrWoYgDo9ipW25tyE-w" target="_blank">
            Project Notes
        </a>

</body>
</html>
